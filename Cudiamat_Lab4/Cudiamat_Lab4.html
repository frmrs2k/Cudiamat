<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="calculatorDesign.css">
    <title>Calculator</title>
</head>

<body>

<div class="calBody">
    <div class="op"></div>

    <table>
        <tr>
        <td><div class="btn design">7</div></td>
        <td><div class="btn design">8</div></td>
        <td><div class="btn design">9</div></td>
        <td><div class="btn operator">÷</div></td>

        <tr>
        <td><div class="btn design">4</div></td>
        <td><div class="btn design">5</div></td>
        <td><div class="btn design">6</div></td>
        <td><div class="btn operator">×</div></td>

        <tr>
        <td><div class="btn design">1</div></td>
        <td><div class="btn design">2</div></td>
        <td><div class="btn design">3</div></td>
        <td><div class="btn operator">-</div></td>

        <tr>
        <td colspan="2"><div class="btn designwide">0</div></td>
        <td><div class="btn design">.</div></td>
        <td><div class="btn operator">+</div></td>

        <tr>
        <td colspan="2"><div class="btn designwide">C</div></td>
        <td colspan="2"><div class="btn designwide">=</div></td>
    </table>
</div>
</body>
</html>
